["Youssef","So, the project focuses on the impact of urbanization on local ecosystems."],["Sara","Sorry, could you explain what you mean by 'the growth of cities'?"],["Youssef","Sure — it means cities becoming larger as populations increase and more buildings, roads, and facilities are constructed."],["Sara","Okay, that makes sense. Excuse me, could you say that again — how long should the presentation be?"],["Youssef","It should be about ten minutes."],["Sara","I'm sorry, I didn't catch that. Did you say ten minutes?"],["Youssef","Yes, ten minutes. And groups should be 3 or 4 students."],["Sara","Sorry, could you give me an example of what to include?"],["Youssef","We should discuss both positive and negative effects of urbanization on local ecosystems."],["Sara","So, I'm confused now. Could you clarify that?"],["Youssef","Of course — we need to show both sides: the benefits of city growth and the environmental costs."],["Sara","Perfect. Now everything is clear."]],
questions:[
["A","Task 1 — Appropriate Response","CHOOSE THE APPROPRIATE RESPONSE.","Your classmate explains something, but you do not understand what she means.",["That's a good idea.","Could you explain what you mean?","I completely agree.","That's exactly right."],"Could you explain what you mean?","When you don't understand someone's meaning, the natural response is to directly ask them to explain.",1],
["A","Task 1 — Appropriate Response","CHOOSE THE APPROPRIATE RESPONSE.","You did not hear what someone said.",["Could you say that again?","What do you think?","That's interesting.","I understand now."],"Could you say that again?","When you didn't hear something, you ask the person to repeat it.",1],
["A","Task 1 — Appropriate Response","CHOOSE THE APPROPRIATE RESPONSE.","You understand the general idea but need a concrete example.",["Could you repeat that?","Are you sure?","Could you give me an example?","I don't agree."],"Could you give me an example?","Asking for an example is the appropriate way to get a concrete illustration of a general idea.",1],
["A","Task 1 — Appropriate Response","CHOOSE THE APPROPRIATE RESPONSE.","You want someone to make an unclear point more understandable.",["Could you clarify that?","That's a good point.","I completely understand.","What happened?"],"Could you clarify that?","Asking someone to clarify is the direct way to request a clearer explanation of an unclear point.",1],
["C","Task 2 — Matching","MATCH THE SITUATION WITH THE EXPRESSION.","Drag each expression to the situation it matches.",[{id:"r1",text:"You didn't hear something clearly."},{id:"r2",text:"You don't understand the meaning of an expression."},{id:"r3",text:"You need an example to understand an idea."},{id:"r4",text:"You want someone to explain an unclear point."}],[["c1","Could you say that again?","r1"],["c2","What do you mean by...?","r2"],["c3","Could you give me an example?","r3"],["c4","Could you clarify that?","r4"]],"Each expression maps to a specific communicative need: repetition, meaning, examples, or clarification.",4],
["D","Task 3 — Prediction","PREDICT THE LISTENING.","You are going to hear two students discussing a school project. Which topics are you most likely to hear? Select THREE.",["Project instructions","Presentation requirements","A football match","Group size","Local ecosystems","A family holiday"],["Presentation requirements","Group size","Local ecosystems"],"The conversation focuses on presentation requirements, group size, and local ecosystems.",3],
["A","Task 4 — Best Summary","CHOOSE THE BEST SUMMARY.","What is the conversation mainly about?",["Two students are preparing for a science examination.","Two students are discussing a science project and clarifying unclear instructions.","Two students are discussing the effects of social media on teenagers.","Two students are planning a school trip to a natural area."],"Two students are discussing a science project and clarifying unclear instructions.","Sara repeatedly asks Youssef to clarify, repeat, or explain project instructions.",1],
["A","Task 5 — Main Problem","IDENTIFY THE MAIN PROBLEM.","Why does Sara ask Youssef several questions?",["She has forgotten when the science exam will take place.","She does not understand several parts of the project instructions.","She wants Youssef to complete the project for her.","She disagrees with the teacher's decision about urbanization."],"She does not understand several parts of the project instructions.","Sara's questions are clarification requests about the project instructions.",1],
["A","Task 6 — Project Details","COMPLETE THE PROJECT DETAILS.","Presentation length:",["5 minutes","10 minutes","15 minutes","20 minutes"],"10 minutes","Youssef confirms the presentation should be about ten minutes.",1],
["A","Task 6 — Project Details","COMPLETE THE PROJECT DETAILS.","Group size:",["Exactly 2 students","Exactly 3 students","3 or 4 students","4 or 5 students"],"3 or 4 students","Youssef says groups should be 3 or 4 students.",1],
["A","Task 6 — Project Details","COMPLETE THE PROJECT DETAILS.","The presentation should discuss:",["Only negative effects","Only positive effects","Both positive and negative effects","The history of urbanization"],"Both positive and negative effects","Youssef says they need to show both sides.",1],
["A","Task 7 — Understand Explanation","UNDERSTAND THE EXPLANATION.","What does Youssef mean by \"the growth of cities\"?",["Cities becoming larger as populations increase and more buildings, roads, and facilities are constructed.","Cities becoming smaller because people move to rural areas.","Cities becoming cleaner because new environmental laws are introduced.","Cities becoming older as historical buildings are preserved."],"Cities becoming larger as populations increase and more buildings, roads, and facilities are constructed.","Youssef explicitly defines the phrase this way.",1],
["A","Task 8 — Repeated Detail","LISTEN FOR A REPEATED DETAIL.","What information is Sara asking Youssef to repeat?",["The number of students in each group","The meaning of local ecosystems","The length of the presentation","The number of examples required"],"The length of the presentation","She is confirming the presentation length: ten minutes.",1],
["A","Task 9 — Purpose","IDENTIFY THE PURPOSE.","What is the communicative purpose of: \"Sorry, could you explain what you mean by 'the growth of cities'?\"",["Expressing agreement","Asking for clarification","Giving an opinion","Making a complaint"],"Asking for clarification","This is a direct request to clarify the meaning of a phrase.",1],
["A","Task 10 — Purpose","IDENTIFY THE PURPOSE.","What is the communicative purpose of: \"Excuse me, could you say that again?\"",["Asking someone to repeat information","Asking someone to give advice","Expressing disagreement","Expressing certainty"],"Asking someone to repeat information","This phrase is a direct request for repetition.",1],
["A","Task 11 — Purpose","IDENTIFY THE PURPOSE.","What is the communicative purpose of: \"Sorry, could you give me an example?\"",["Asking for repetition","Asking for an example","Expressing an opinion","Apologizing for being late"],"Asking for an example","This phrase directly requests a concrete example.",1],
["A","Task 12 — Meaning","INTERPRET THE MEANING.","Sara says: \"So, I'm confused now. Could you clarify that?\" What does Sara want Youssef to do?",["Give her more information about the teacher.","Explain the point more clearly.","Change the topic completely.","Tell her when the project is due."],"Explain the point more clearly.","Sara is confused and explicitly asks Youssef to clarify.",1],
["A","Task 13 — Speaker Difficulty","UNDERSTAND THE SPEAKER'S DIFFICULTY.","When Sara says: \"I'm sorry, I didn't catch that.\" What is she communicating?",["She disagrees with what Youssef said.","She has heard the information but rejects it.","She did not hear or understand what was just said clearly.","She wants to end the conversation."],"She did not hear or understand what was just said clearly.","\"I didn't catch that\" means she did not hear or understand clearly.",1],
["A","Task 14 — Appropriate Expression","CHOOSE THE MOST APPROPRIATE EXPRESSION.","You do not understand the meaning of \"local ecosystems.\" Which response is most appropriate?",["Could you give me some advice?","What do you mean by \"local ecosystems\"?","I completely agree with you.","That's a very interesting opinion."],"What do you mean by \"local ecosystems\"?","Ask directly about the meaning of a specific term.",1],
["A","Task 15 — Clarification Strategy","CHOOSE THE BEST CLARIFICATION STRATEGY.","You understand the general idea but are not sure what \"electronically\" means. What should you say?",["Could you give me an example of what you mean by \"electronically\"?","Could you repeat the entire conversation from the beginning?","I don't agree with this requirement.","That's exactly what I wanted to hear."],"Could you give me an example of what you mean by \"electronically\"?","Asking for an example is a helpful clarification strategy.",1],
["A","Task 16 — Polite Expression","CHOOSE THE MOST POLITE EXPRESSION.","Which expression is the most appropriate way to ask someone to repeat information?",["Repeat that.","Say it again.","Could you say that again, please?","You need to say that again."],"Could you say that again, please?","This phrasing is a polite modal question with \"please.\"",1],
["C","Task 17 — Identify the Function","IDENTIFY THE FUNCTION.","Drag each function to the expression it matches.",[{id:"r1",text:"\"Could you say that again?\""},{id:"r2",text:"\"What do you mean by...?\""},{id:"r3",text:"\"Could you clarify that?\""},{id:"r4",text:"\"Could you give me an example?\""}],[["c1","Asking someone to repeat","r1"],["c2","Asking about the meaning of something","r2"],["c3","Asking for clarification","r3"],["c4","Asking for an example","r4"]],"Each expression serves a distinct communicative function.",4],
["A","Task 18 — Final Understanding","LISTENING TO THE FINAL UNDERSTANDING.","At the end, Sara says: \"Perfect. Now everything is clear.\" What does this show?",["She has decided not to do the project.","She has finally understood the main requirements.","She disagrees with Youssef's explanation.","She wants the teacher to explain everything again."],"She has finally understood the main requirements.","Her earlier confusion has been resolved.",1],
["A","Task 19 — Reconstruct Information","RECONSTRUCT THE INFORMATION.","Which combination correctly summarizes the project requirements?",["Groups of 2, a five-minute speech, only negative effects","Groups of 3 or 4, a ten-minute presentation, both positive and negative effects","Groups of 3, a fifteen-minute presentation, only positive effects","Groups of 4 or 5, a ten-minute essay, environmental vocabulary only"],"Groups of 3 or 4, a ten-minute presentation, both positive and negative effects","This matches the group size, length, and content details.",1],
["A","Task 20 — Overall Check","OVERALL LISTENING CHECK.","Which sequence best represents what happens in the conversation?",["Sara understands everything → Youssef asks questions → they change the project topic.","Youssef explains the project → Sara identifies unclear points → Youssef clarifies them → Sara confirms her understanding.","Sara explains the project → Youssef disagrees → Sara changes the requirements.","Youssef gives the final presentation → Sara evaluates it → they submit the project."],"Youssef explains the project → Sara identifies unclear points → Youssef clarifies them → Sara confirms her understanding.","This matches the actual conversation flow.",1]
]};
const q=quizConfig.questions.map((x,i)=>({type:x[0],taskLabel:x[1],instruction:x[2],task:x[3],data:x[4],answer:x[5],explanation:x[6],points:x[7],index:i}));
let state={index:0,answers:{},orders:{},matchOrders:{},timer:0,attempts:+localStorage.getItem("lqAttempts")||0,finished:false};
let timerId=null, multiDelay=null, audioLoaded=false,audioFailed=false;
const audio=document.getElementById("dialogueAudio"),quizView=document.getElementById("quizView"),resultView=document.getElementById("resultView"),reviewView=document.getElementById("reviewView");
const shuffle=a=>{let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
const phaseOf=i=>i<6?"PRE-LISTENING":i<8?"WHILE-LISTENING — First Listening: General Understanding":i<13?"WHILE-LISTENING — Second Listening: Specific Information":i<18?"WHILE-LISTENING — Third Listening: Understanding the Function":"POST-LISTENING";
const fmt=s=>String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
const transcript=()=>`<details class="accordion"><summary>Show Transcript</summary><div class="transcript">${quizConfig.audioTranscript.map(x=>`<p><b>${x[0]}:</b> ${x[1]}</p>`).join("")}</div></details>`;
const Timer={start(){clearInterval(timerId);timerId=setInterval(()=>{state.timer++;let e=document.getElementById("timer");if(e)e.textContent=fmt(state.timer)},1000)},pause(){clearInterval(timerId)},reset(){clearInterval(timerId);state.timer=0}};
function score(){return Object.values(state.answers).reduce((s,a)=>s+(a.points||0),0)}
function stats(){let a=Object.values(state.answers),correct=a.filter(x=>x.points>0).length,wrong=a.filter(x=>x.locked&&x.points===0).length;return `<div class="stats"><span>✅ Correct: ${correct}</span><span>❌ Wrong: ${wrong}</span><span>Remaining: ${q.length-a.length}</span><span>Score: ${score().toFixed(2)} /33</span><span>Timer <span id="timer">${fmt(state.timer)}</span></span></div>`}
function audioModule(){
 if(state.index<6)return "";
 if(!audioLoaded&&!audioFailed){audio.src=quizConfig.audioFileUrl;audio.load();audioLoaded=true}
 return `<section class="audio-player ${audioFailed?"opacity-60":""}" aria-label="Dialogue audio player">
 <div class="speaker-row"><div class="speaker"><div class="avatar">👨</div>Youssef</div><div class="speaker"><div class="avatar">👩</div>Sara</div></div>
 <div class="audio-controls"><button class="audio-btn" id="back10" ${audioFailed?"disabled":""}>◀◀ 10</button><button class="audio-btn" id="playToggle" ${audioFailed?"disabled":""}>${audio.paused?"▶":"⏸"}</button><button class="audio-btn" id="forward10" ${audioFailed?"disabled":""}>10 ▶▶</button></div>
 <div class="progress"><div id="progressFill"></div></div>${audioFailed?'<p class="audio-error">Audio couldn’t be loaded — ask your teacher for the printed transcript.</p>':""}</section>`;
}
function render(){
 let item=q[state.index],a=state.answers[state.index],body=`<div class="phase">${phaseOf(state.index)}</div>${audioModule()}<div class="instruction">${item.instruction}</div><div class="task">${item.task}</div>`;
 body+=item.type==="A"?renderA(item,a):item.type==="C"?renderC(item,a):renderD(item,a);
 body+=`<div class="nav-row"><button class="nav-btn" id="prev" ${state.index===0?"disabled":""}>◀ Previous</button><b>${state.index+1} / ${q.length}</b><button class="nav-btn next" id="next" ${!a?.locked?"disabled":""}>Next ▶</button></div>${stats()}`;
 quizView.innerHTML=body; bindCommon(); if(item.type==="A")bindA();if(item.type==="C")bindC();if(item.type==="D")bindD();
}
function renderA(item,a){
 if(!state.orders[item.index])state.orders[item.index]=shuffle(item.data);
 return `<div class="choices">${state.orders[item.index].map((c,i)=>{let cl="choice";if(a?.locked){if(c===item.answer)cl+=" correct";else if(c===a.selected)cl+=" wrong"}else if(c===a?.selected)cl+=" selected";return `<button class="${cl}" data-choice="${i}" ${a?.locked?"disabled":""}>${c}</button>`}).join("")}</div>${a?.locked?`<div class="feedback">${a.correct?"✅ Excellent work! ":"❌ Keep learning! "}${item.explanation}</div>`:""}`;
}
function renderC(item,a={}){
 if(!state.matchOrders[item.index]){let arr=shuffle(item.answer);if(arr.every((x,i)=>x[2]===item.data[i].id))arr=[arr[1],arr[0],arr[2],arr[3]];state.matchOrders[item.index]=arr}
 let placements=a.placements||{};
 return `<div class="match-layout"><div class="match-rows">${item.data.map(r=>{let chip=placements[r.id],ok=chip?.[2]===r.id;return `<div class="match-row ${a.locked?(ok?"placed-correct":"placed-wrong"):""}"><div class="row-text">${r.text}</div><div class="drop-slot" data-row="${r.id}">${chip?`<button class="chip" data-chip="${chip[0]}" ${a.locked?"disabled":""}>${chip[1]}</button>`:""}</div>${a.locked&&!ok?`<div class="correct-hint">Correct: ${item.answer.find(c=>c[2]===r.id)[1]}</div>`:""}</div>`}).join("")}</div><div class="chip-tray" id="tray">${state.matchOrders[item.index].filter(c=>!Object.values(placements).some(p=>p[0]===c[0])).map(c=>`<button class="chip" data-chip="${c[0]}" ${a.locked?"disabled":""}>${c[1]}</button>`).join("")}</div></div><button class="primary-btn check-btn" id="checkMatch" ${Object.keys(placements).length!==4||a.locked?"disabled":""}>Check Answers</button>${a.locked?`<div class="feedback">${item.explanation}</div>`:""}`;
}
function renderD(item,a={}){
 if(!state.orders[item.index])state.orders[item.index]=shuffle(item.data);
 let s=a.selected||[];
 return `<div class="multi-grid">${state.orders[item.index].map((o,i)=>{let cl="tile";if(a.locked){if(item.answer.includes(o))cl+=" correct";else if(s.includes(o))cl+=" wrong";else cl+=" muted"}else if(s.includes(o))cl+=" selected";return `<button class="${cl}" data-tile="${i}" ${a.locked?"disabled":""}>${o}</button>`}).join("")}</div>${a.locked?`<div class="feedback">${a.correct?"✅ Correct selection! ":"❌ Not quite. "}${item.explanation}</div>`:""}`;
}
function bindCommon(){
 document.getElementById("prev").onclick=()=>{state.index--;render()};
 document.getElementById("next").onclick=()=>{if(state.index===q.length-1)showResults();else{state.index++;render()}};
 bindAudio();
}
function bindA(){document.querySelectorAll("[data-choice]").forEach(b=>b.onclick=()=>{let item=q[state.index],selected=state.orders[item.index][+b.dataset.choice],correct=selected===item.answer;state.answers[state.index]={selected,locked:true,correct,points:correct?item.points:0};sound(correct);render()})}
function bindD(){document.querySelectorAll("[data-tile]").forEach(b=>b.onclick=()=>{let item=q[state.index],value=state.orders[item.index][+b.dataset.tile],a=state.answers[state.index]||{selected:[]};a.selected=a.selected.includes(value)?a.selected.filter(x=>x!==value):a.selected.length<3?[...a.selected,value]:a.selected;state.answers[state.index]=a;sound(null);render();if(a.selected.length===3){clearTimeout(multiDelay);multiDelay=setTimeout(()=>{let exact=item.answer.every(x=>a.selected.includes(x));state.answers[state.index]={...a,locked:true,correct:exact,points:exact?3:0};sound(exact);render()},500)}})}
// TYPE C: Pointer Events create touch-compatible draggable chips. Placements remain editable until Check Answers.
function bindC(){
 let active=null;
 document.querySelectorAll(".chip").forEach(el=>el.addEventListener("pointerdown",e=>{if(el.disabled)return;active={el,id:el.dataset.chip,x:e.clientX,y:e.clientY};el.setPointerCapture(e.pointerId);el.classList.add("dragging");el.style.width=el.offsetWidth+"px";el.style.left=e.clientX-el.offsetWidth/2+"px";el.style.top=e.clientY-el.offsetHeight/2+"px"}));
 document.addEventListener("pointermove",moveChip,{once:true});
 function moveChip(e){if(!active)return;active.el.style.left=e.clientX-active.el.offsetWidth/2+"px";active.el.style.top=e.clientY-active.el.offsetHeight/2+"px";document.addEventListener("pointermove",moveChip,{once:true})}
 document.addEventListener("pointerup",dropChip,{once:true});
 function dropChip(e){if(!active)return;let target=document.elementFromPoint(e.clientX,e.clientY)?.closest(".drop-slot"),item=q[state.index],a=state.answers[state.index]||{placements:{}};if(target){let chip=item.answer.find(c=>c[0]===active.id);Object.keys(a.placements).forEach(k=>{if(a.placements[k]?.[0]===active.id)delete a.placements[k]});if(a.placements[target.dataset.row]){let displaced=a.placements[target.dataset.row];let old=Object.keys(a.placements).find(k=>a.placements[k]?.[0]===active.id);if(old)a.placements[old]=displaced}a.placements[target.dataset.row]=chip;state.answers[state.index]=a;sound(null)}active.el.classList.remove("dragging");active.el.removeAttribute("style");active=null;render()}
 document.getElementById("checkMatch").onclick=()=>{let item=q[state.index],a=state.answers[state.index],points=Object.entries(a.placements).filter(([r,c])=>c[2]===r).length;state.answers[state.index]={...a,locked:true,points,correct:points===4};sound(points===4);render()}
}
function bindAudio(){
 let p=document.getElementById("playToggle");if(!p)return;
 p.onclick=()=>{if(audio.paused){const attempt=audio.play();attempt.then(()=>{p.textContent="⏸"}).catch(err=>{console.error(err);p.textContent="▶"})}else audio.pause()};
 document.getElementById("back10").onclick=()=>{const go=()=>audio.currentTime=Math.max(0,audio.currentTime-10);Number.isNaN(audio.duration)?audio.addEventListener("loadedmetadata",go,{once:true}):go()};
 document.getElementById("forward10").onclick=()=>{const go=()=>audio.currentTime=Math.min(audio.duration,audio.currentTime+10);Number.isNaN(audio.duration)?audio.addEventListener("loadedmetadata",go,{once:true}):go()};
}
audio.addEventListener("play",()=>{let e=document.getElementById("playToggle");if(e)e.textContent="⏸"});audio.addEventListener("pause",()=>{let e=document.getElementById("playToggle");if(e)e.textContent="▶"});audio.addEventListener("timeupdate",()=>{let e=document.getElementById("progressFill");if(e&&audio.duration)e.style.width=(audio.currentTime/audio.duration*100)+"%"});audio.addEventListener("error",()=>{audioFailed=true;render()});
function sound(ok){if(audio&&!audio.paused)return;try{let c=new AudioContext(),o=c.createOscillator(),g=c.createGain();o.frequency.value=ok===true?620:ok===false?180:380;g.gain.setValueAtTime(.05,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.12);o.connect(g).connect(c.destination);o.start();o.stop(c.currentTime+.12)}catch(e){}}
function remark(s){return s<16.5?"Fail":s<19.8?"Pass":s<23.1?"Fairly Good":s<26.4?"Good":s<29.7?"Very Good":"Excellent!"}
function showResults(){
 Timer.pause();state.finished=true;quizView.classList.add("hidden");resultView.classList.remove("hidden");let s=score(),answered=Object.values(state.answers),correct=answered.filter(a=>a.points>0).length,wrong=answered.filter(a=>a.points===0).length,acc=Math.round(s/33*100),best=Math.max(+localStorage.getItem("lqBest")||0,s);state.attempts++;localStorage.setItem("lqBest",best);localStorage.setItem("lqAttempts",state.attempts);localStorage.setItem("lqLast",s);localStorage.setItem("lqTime",state.timer);
 let tasks={};q.forEach((x,i)=>{if(!tasks[x.taskLabel])tasks[x.taskLabel]={earned:0,total:0};tasks[x.taskLabel].earned+=state.answers[i]?.points||0;tasks[x.taskLabel].total+=x.points});
 resultView.innerHTML=`<h1 class="result-title">English2BAC Listening Quiz 1</h1><p class="text-center font-semibold">Unit 2 · EXPRESSING LACK OF UNDERSTANDING & ASKING FOR CLARIFICATION · LISTENING - QUIZ 1</p><div class="score-badge">${s.toFixed(2)}<small>/33</small></div><div class="remark" id="remark">Checking...</div><div class="summary-grid"><div class="summary-box"><b>${s.toFixed(2)} /33</b>Final Score</div><div class="summary-box"><b>${correct} / ${wrong}</b>Correct / Wrong</div><div class="summary-box"><b>${acc}%</b>Accuracy</div><div class="summary-box"><b>${fmt(state.timer)}</b>Time Taken</div><div class="summary-box"><b>${state.attempts}</b>Attempts</div><div class="summary-box"><b>${best.toFixed(2)} /33</b>Best Score</div></div><div class="task-breakdown"><h2>Performance by Task</h2>${Object.entries(tasks).map(([n,v])=>`<div class="breakdown-row"><span>${n}</span><b>${v.earned}/${v.total}</b></div>`).join("")}</div>${transcript()}<div class="result-actions"><button class="primary-btn" id="review">Review My Answers</button><button class="primary-btn secondary-btn" id="print">Print Results</button><button class="primary-btn secondary-btn" id="save">Save Results</button><button class="primary-btn secondary-btn" id="restart">Restart Quiz</button></div>`;
 let labels=["Fail","Pass","Fairly Good","Good","Very Good","Excellent!"],n=0,spin=setInterval(()=>{document.getElementById("remark").textContent=labels[n++%labels.length]},130);setTimeout(()=>{clearInterval(spin);document.getElementById("remark").textContent=remark(s)},3000);
 if(s>=26.4)for(let i=0;i<70;i++){let d=document.createElement("i");d.className="confetti";d.style.left=Math.random()*100+"%";d.style.background=["#2563eb","#16a34a","#f59e0b","#ef4444"][i%4];d.style.animationDelay=Math.random()*1.5+"s";document.body.appendChild(d);setTimeout(()=>d.remove(),4800)}
 document.getElementById("review").onclick=showReview;document.getElementById("print").onclick=()=>window.print();document.getElementById("save").onclick=()=>{let blob=new Blob([resultView.innerText],{type:"text/plain"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="English2BAC-results.txt";a.click();URL.revokeObjectURL(a.href)};document.getElementById("restart").onclick=restart;
}
function showReview(){resultView.classList.add("hidden");reviewView.classList.remove("hidden");let last="";reviewView.innerHTML=`<h1 class="result-title">Review My Answers</h1>${transcript()}${q.map((x,i)=>{let a=state.answers[i],heading=x.taskLabel===last?"":(last=x.taskLabel,`<h2 class="mt-6 font-extrabold text-[#12385d]">${x.taskLabel}</h2>`);let answer=x.type==="A"?`<p class="${a.correct?"review-ok":"review-bad"}">Student Answer: ${a.selected}</p><p class="review-ok">Correct Answer: ${x.answer}</p>`:x.type==="D"?`<p class="${a.correct?"review-ok":"review-bad"}">Your selections: ${(a.selected||[]).join(", ")}</p><p class="review-ok">Correct selections: ${x.answer.join(", ")}</p>`:`<p class="${a.correct?"review-ok":"review-bad"}">Score: ${a.points}/${x.points}</p>${x.data.map(r=>`<p>${r.text}<br><b>Your match:</b> ${a.placements[r.id]?.[1]||"None"} · <b>Correct:</b> ${x.answer.find(c=>c[2]===r.id)[1]}</p>`).join("")}`;return `${heading}<article class="review-item"><h3>${i+1}. ${x.instruction}</h3><p>${x.task}</p>${answer}<p><b>Explanation:</b> ${x.explanation}</p></article>`}).join("")}<div class="result-actions"><button class="primary-btn" id="backResults">Back to Results</button><button class="primary-btn secondary-btn" id="restart2">Restart Quiz</button></div>`;document.getElementById("backResults").onclick=()=>{reviewView.classList.add("hidden");resultView.classList.remove("hidden")};document.getElementById("restart2").onclick=restart}
function restart(){Timer.reset();state={index:0,answers:{},orders:{},matchOrders:{},timer:0,attempts:state.attempts,finished:false};audio.pause();audio.currentTime=0;resultView.classList.add("hidden");reviewView.classList.add("hidden");quizView.classList.remove("hidden");Timer.start();render()}
document.addEventListener("keydown",e=>{if(document.activeElement.closest?.(".audio-player")){if(e.code==="Space"){e.preventDefault();document.getElementById("playToggle")?.click()}if(e.key==="ArrowLeft")document.getElementById("back10")?.click();if(e.key==="ArrowRight")document.getElementById("forward10")?.click();return}if(e.key==="ArrowLeft")document.getElementById("prev")?.click();if(e.key==="ArrowRight")document.getElementById("next")?.click();if(/^[1-6]$/.test(e.key)){let all=document.querySelectorAll("[data-choice],[data-tile]");all[+e.key-1]?.click()}});
Timer.start();render();
</script>
 
</body></html>
