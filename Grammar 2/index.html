  <script>
    const quizConfig = {
      unit: "2",
      title: "MODAL VERBS",
      lesson: "GRAMMAR QUIZ 2",
      randomizeQuestions: false,
      randomizeChoices: true,
      timerEnabled: true,
      timerMode: "countup",
      countdownSeconds: 600,
      showConfetti: true,
      enableSounds: true,
      questions: [
        { level:1, category:"Choose the Correct Modal", question:"CHOOSE THE CORRECT MODAL.", task:"Rachida ______ miss her interview tomorrow because she needs the job to support her family.", choices:["needn't","shouldn't","wouldn't","mustn't"], correctAnswer:"shouldn't", explanation:"'Shouldn't' expresses advice against doing something — here, advising her not to miss the important interview.", hint:"Think about what advice fits someone who really needs this job.", points:1 },
        { level:1, category:"Choose the Correct Modal", question:"CHOOSE THE CORRECT MODAL.", task:"Rachid ______ go to his swimming classes because of the lockdown.", choices:["couldn't","needn't","wouldn't","shouldn't"], correctAnswer:"couldn't", explanation:"'Couldn't' expresses past inability — the lockdown made it impossible for him to go.", hint:"Think about what the lockdown prevented him from doing.", points:1 },
        { level:1, category:"Choose the Correct Modal", question:"CHOOSE THE CORRECT MODAL.", task:"It's very cold today. Do you think it ______ snow?", choices:["will","must","should","can"], correctAnswer:"will", explanation:"'Will' is used here to ask about a simple future prediction.", hint:"Think about a simple prediction about the weather.", points:1 },
        { level:2, category:"Complete the Situation", question:"COMPLETE THE SITUATION.", task:"Jessica ______ have seen me because she walked past without saying 'hello'.", choices:["can't","won't","shouldn't","mightn't"], correctAnswer:"can't", explanation:"'Can't have + past participle' expresses that something is logically impossible based on the evidence.", hint:"Think about what the evidence (no 'hello') tells you.", points:1 },
        { level:2, category:"Complete the Situation", question:"COMPLETE THE SITUATION.", task:"I asked my brother to lend me his bike, but he ______ agree, no matter how much I insisted.", choices:["wouldn't","couldn't","shouldn't","mightn't"], correctAnswer:"wouldn't", explanation:"'Wouldn't' expresses a refusal — someone was simply unwilling to do something.", hint:"Think about someone refusing to do something, even after being asked.", points:1 },
        { level:2, category:"Complete the Situation", question:"COMPLETE THE SITUATION.", task:"My little sister ______ eat any vegetables, no matter what I cook for her.", choices:["won't","can't","shouldn't","mustn't"], correctAnswer:"won't", explanation:"'Won't' expresses a refusal or stubborn unwillingness to do something.", hint:"Think about someone who simply refuses to do something, again and again.", points:1 },
        { level:3, category:"Know the Function", question:"WHAT DOES THIS MODAL EXPRESS?", task:"What does \"will\" express in this sentence? \"I'm sure he will pass the exam; he has worked so hard.\"", choices:["Certainty about the future","A polite request","An obligation","A past habit"], correctAnswer:"Certainty about the future", explanation:"'Will' here expresses the speaker's confident prediction about a future event.", hint:"The speaker sounds very sure about what is going to happen.", points:1 },
        { level:3, category:"Know the Function", question:"WHAT DOES THIS MODAL EXPRESS?", task:"What does \"couldn't\" express in this sentence? \"She apologized because she couldn't attend the meeting yesterday.\"", choices:["Past inability","Future possibility","Present permission","Strong obligation"], correctAnswer:"Past inability", explanation:"'Couldn't' expresses an inability that existed in the past.", hint:"Think about what she was unable to do at that specific time.", points:1 },
        { level:3, category:"Know the Function", question:"WHAT DOES THIS MODAL EXPRESS?", task:"What does \"won't\" express in this sentence? \"He won't listen to any advice, no matter what we say.\"", choices:["Refusal","Permission","Past habit","Necessity"], correctAnswer:"Refusal", explanation:"'Won't' expresses a firm refusal to do something.", hint:"Think about someone who simply refuses, again and again.", points:1 },
        { level:4, category:"Diagnose: Spot and Correct the Modal Error", question:"CHOOSE THE CORRECT SENTENCE.", task:"❌ She shouldn't to worry about the results.", choices:["She shouldn't worry about the results.","She shouldn't worrying about the results.","She shouldn't worried about the results.","She shouldn't to worrying about the results."], correctAnswer:"She shouldn't worry about the results.", explanation:"A modal such as 'shouldn't' is followed directly by the base form of the verb, without 'to'.", hint:"Do not put 'to' between a modal and the main verb.", points:1 },
        { level:4, category:"Diagnose: Spot and Correct the Modal Error", question:"CHOOSE THE CORRECT SENTENCE.", task:"❌ They couldn't to finish the project on time.", choices:["They couldn't finish the project on time.","They couldn't finishing the project on time.","They couldn't finished the project on time.","They couldn't to finishing the project on time."], correctAnswer:"They couldn't finish the project on time.", explanation:"A modal such as 'couldn't' is followed directly by the base form of the verb, without 'to'.", hint:"Remember the structure: modal + base verb.", points:1 },
        { level:5, category:"Understand the Meaning", question:"CHOOSE THE CORRECT MEANING.", task:"What does this sentence mean? \"I've called him five times, but he won't answer.\"", choices:["He refuses to answer.","He is simply unable to answer.","It is impossible for him to answer.","He forgot to answer."], correctAnswer:"He refuses to answer.", explanation:"'Won't' here expresses a stubborn refusal, not a simple inability.", hint:"Think about whether this is about ability or about willingness.", points:1 },
        { level:5, category:"Understand the Meaning", question:"CHOOSE THE CORRECT MEANING.", task:"What does this sentence mean? \"This can't be the right address; the number doesn't match.\"", choices:["It is logically impossible for this to be correct.","It is forbidden to use this address.","The speaker is physically unable to find the address.","The speaker doesn't remember the address."], correctAnswer:"It is logically impossible for this to be correct.", explanation:"'Can't' here expresses strong certainty that something is NOT true, based on the evidence.", hint:"Think about how sure the speaker feels that this is wrong, based on the evidence.", points:1 },
        { level:5, category:"Understand the Meaning", question:"CHOOSE THE CORRECT MEANING.", task:"What does this sentence mean? \"I'm sorry, I couldn't hear you properly; the line was very bad.\"", choices:["I was unable to hear because of poor conditions.","I refused to listen to you.","It is impossible that you called me.","I am not allowed to hear you."], correctAnswer:"I was unable to hear because of poor conditions.", explanation:"'Couldn't' here expresses a past inability caused by external conditions (a bad phone line).", hint:"Think about what prevented the person from hearing clearly.", points:1 },
        { level:6, category:"Transform", question:"CHOOSE THE SENTENCE WITH THE SAME MEANING.", task:"Choose the sentence with the same meaning: \"He refuses to apologize for what he did.\"", choices:["He won't apologize for what he did.","He mustn't apologize for what he did.","He shouldn't apologize for what he did.","He can't apologize for what he did."], correctAnswer:"He won't apologize for what he did.", explanation:"'Refuse to do X' and 'won't do X' both express an unwillingness to do something.", hint:"Think about which option expresses the same stubborn unwillingness.", points:1 },
        { level:6, category:"Transform", question:"CHOOSE THE SENTENCE WITH THE SAME MEANING.", task:"Choose the sentence with the same meaning: \"It was impossible for us to reach the summit because of the storm.\"", choices:["We couldn't reach the summit because of the storm.","We shouldn't reach the summit because of the storm.","We wouldn't reach the summit because of the storm.","We mightn't reach the summit because of the storm."], correctAnswer:"We couldn't reach the summit because of the storm.", explanation:"'It was impossible for X to do Y' and 'X couldn't do Y' both express an inability in the past.", hint:"Think about which option expresses the same past inability.", points:1 },
        { level:7, category:"Grammar in Context", question:"COMPLETE THE CONTEXT.", task:"Karim just failed his driving test for the third time. He is very frustrated and says: \"I just know I ______ pass this test — I always make a mistake!\"", choices:["won't","shouldn't","mustn't","needn't"], correctAnswer:"won't", explanation:"'Won't' here expresses a firm, pessimistic prediction about the future, based on his past failures.", hint:"Think about what he firmly believes will happen, based on his past attempts.", points:1 },
        { level:7, category:"Grammar in Context", question:"COMPLETE THE CONTEXT.", task:"Drivers ______ speed near schools; children could suddenly run into the road.", choices:["shouldn't","wouldn't","needn't","couldn't"], correctAnswer:"shouldn't", explanation:"'Shouldn't' gives strong advice against a dangerous behavior.", hint:"Think about the advice that best protects the children's safety.", points:1 },
        { level:8, category:"Final Challenge: Mixed Modal Challenge", question:"CHOOSE THE BEST SENTENCE.", task:"Yasmine invited her friend to the birthday party, but her friend has a bad cold and is not feeling well. What is the best sentence?", choices:["She couldn't come to the party because she shouldn't spread her cold to everyone.","She couldn't to come to the party because she shouldn't to spread her cold to everyone.","She could come to the party because she shouldn't spreading her cold to everyone.","She couldn't coming to the party because she shouldn't spread her cold to everyone."], correctAnswer:"She couldn't come to the party because she shouldn't spread her cold to everyone.", explanation:"'Couldn't' (inability) and 'shouldn't' (advice against) are both followed directly by the base form of the verb, without 'to' or '-ing'.", hint:"Think about the structure both of these modals require.", points:1 },
        { level:8, category:"Final Challenge: Mixed Modal Challenge", question:"CHOOSE THE BEST SENTENCE.", task:"The weather forecast predicts rain for tomorrow, but the coach doesn't plan to cancel practice because of a light shower. Choose the best sentence:", choices:["The weather forecast says it will rain tomorrow, but the coach won't cancel practice because of a light shower.","The weather forecast says it will raining tomorrow, but the coach won't to cancel practice because of a light shower.","The weather forecast says it will to rain tomorrow, but the coach won't cancelling practice because of a light shower.","The weather forecast says it will rains tomorrow, but the coach won't cancels practice because of a light shower."], correctAnswer:"The weather forecast says it will rain tomorrow, but the coach won't cancel practice because of a light shower.", explanation:"Both 'will' and 'won't' are followed directly by the base form of the verb: 'will rain', 'won't cancel'.", hint:"Think about the structure both of these modals require — with or without 's' or 'to'.", points:1 }
      ]
    };

    const levelNames = {
      1: "Choose the Correct Modal",
      2: "Complete the Situation",
      3: "Know the Function",
      4: "Diagnose",
      5: "Understand the Meaning",
      6: "Transform",
      7: "Grammar in Context",
      8: "Final Challenge"
    };

    const correctMessages = ["Excellent!", "Great Job!", "Perfect!", "Keep Going!"];
    const incorrectMessages = ["Almost!", "Review this rule.", "Keep learning!", "You'll get the next one!"];

    let currentQuestionIndex = 0;
    let answers = [];
    let shuffledChoices = [];
    let finalTime = 0;
    let resultRecorded = false;

    const elements = {
      quizScreen: document.getElementById("quiz-screen"),
      resultPage: document.getElementById("result-page"),
      reviewPage: document.getElementById("review-page"),
      instruction: document.getElementById("instruction-box"),
      task: document.getElementById("task-area"),
      hintButton: document.getElementById("hint-button"),
      hintPanel: document.getElementById("hint-panel"),
      choices: document.getElementById("choices-grid"),
      feedback: document.getElementById("feedback-panel"),
      feedbackTitle: document.getElementById("feedback-title"),
      explanation: document.getElementById("explanation-text"),
      previous: document.getElementById("previous-button"),
      next: document.getElementById("next-button"),
      counter: document.getElementById("question-counter"),
      correct: document.getElementById("correct-count"),
      wrong: document.getElementById("wrong-count"),
      remaining: document.getElementById("remaining-count"),
      score: document.getElementById("live-score"),
      timer: document.getElementById("timer-display")
    };

    /* Independent timer module: count-up now, with countdown support retained for configuration. */
    const quizTimer = (() => {
      let seconds = 0;
      let timerId = null;

      function format(totalSeconds) {
        const mins = Math.floor(totalSeconds / 60).toString().padStart(2, "0");
        const secs = (totalSeconds % 60).toString().padStart(2, "0");
        return `${mins}:${secs}`;
      }

      function display() {
        elements.timer.textContent = format(seconds);
      }

      function start() {
        if (!quizConfig.timerEnabled || timerId) return;
        timerId = setInterval(() => {
          if (quizConfig.timerMode === "countdown") {
            seconds = Math.max(0, seconds - 1);
            if (seconds === 0) {
              pause();
              finishQuiz();
            }
          } else {
            seconds += 1;
          }
          display();
        }, 1000);
      }

      function pause() {
        clearInterval(timerId);
        timerId = null;
      }

      function reset() {
        pause();
        seconds = quizConfig.timerMode === "countdown" ? quizConfig.countdownSeconds : 0;
        display();
      }

      function value() { return seconds; }
      return { start, pause, reset, value, format };
    })();

    function shuffle(items) {
      const copy = [...items];
      for (let index = copy.length - 1; index > 0; index--) {
        const randomIndex = Math.floor(Math.random() * (index + 1));
        [copy[index], copy[randomIndex]] = [copy[randomIndex], copy[index]];
      }
      return copy;
    }

    function getScore() {
      return answers.reduce((sum, answer) => sum + (answer && answer.isCorrect ? 1 : 0), 0);
    }

    function getAnsweredCount() {
      return answers.filter(Boolean).length;
    }

    function randomMessage(messages) {
      return messages[Math.floor(Math.random() * messages.length)];
    }

    /* Web Audio feedback is user-triggered and uses only generated oscillator tones. */
    function playSound(type) {
      if (!quizConfig.enableSounds) return;
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audio = new AudioContext();
        const now = audio.currentTime;
        const frequencies = type === "correct" ? [523, 659] : type === "wrong" ? [196, 146] : [523, 659, 784, 1046];

        frequencies.forEach((frequency, index) => {
          const oscillator = audio.createOscillator();
          const gain = audio.createGain();
          oscillator.type = "sine";
          oscillator.frequency.value = frequency;
          gain.gain.setValueAtTime(0.0001, now + index * 0.1);
          gain.gain.exponentialRampToValueAtTime(0.09, now + index * 0.1 + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + index * 0.1 + 0.18);
          oscillator.connect(gain).connect(audio.destination);
          oscillator.start(now + index * 0.1);
          oscillator.stop(now + index * 0.1 + 0.2);
        });
      } catch (error) {}
    }

    /* The same Type A rendering logic is reused for all eight levels. */
    function renderQuestion() {
      const question = quizConfig.questions[currentQuestionIndex];
      const savedAnswer = answers[currentQuestionIndex];

      elements.instruction.textContent = question.question;
      elements.task.textContent = question.task;
      elements.task.classList.toggle("error-example", question.task.startsWith("❌"));
      elements.counter.textContent = `${currentQuestionIndex + 1} / ${quizConfig.questions.length}`;
      elements.hintPanel.textContent = question.hint;
      elements.hintPanel.classList.remove("visible");
      elements.hintButton.disabled = Boolean(savedAnswer);
      elements.choices.innerHTML = "";

      const choices = shuffledChoices[currentQuestionIndex];
      choices.forEach((choice, index) => {
        const button = document.createElement("button");
        button.className = "choice-button";
        button.type = "button";
        button.dataset.choice = choice;
        button.innerHTML = `<span class="choice-letter">${String.fromCharCode(65 + index)}</span><span>${choice}</span>`;

        if (savedAnswer) {
          button.disabled = true;
          if (choice === question.correctAnswer) button.classList.add("correct");
          if (!savedAnswer.isCorrect && choice === savedAnswer.selected) button.classList.add("wrong");
        } else {
          button.addEventListener("click", () => selectChoice(choice));
        }
        elements.choices.appendChild(button);
      });

      if (savedAnswer) {
        showFeedback(savedAnswer.isCorrect, question.explanation, savedAnswer.message);
      } else {
        elements.feedback.className = "feedback-panel";
      }

      elements.previous.disabled = currentQuestionIndex === 0;
      elements.next.disabled = !savedAnswer;
      updateStats();
    }

    function showFeedback(isCorrect, explanation, message) {
      elements.feedback.className = `feedback-panel visible ${isCorrect ? "correct" : "wrong"}`;
      elements.feedbackTitle.textContent = message;
      elements.explanation.textContent = explanation;
    }

    function selectChoice(choice) {
      if (answers[currentQuestionIndex]) return;
      const question = quizConfig.questions[currentQuestionIndex];
      const isCorrect = choice === question.correctAnswer;
      const message = randomMessage(isCorrect ? correctMessages : incorrectMessages);

      answers[currentQuestionIndex] = { selected: choice, isCorrect, message };
      playSound(isCorrect ? "correct" : "wrong");
      renderQuestion();
    }

    function updateStats() {
      const correct = getScore();
      const answered = getAnsweredCount();
      elements.correct.textContent = correct;
      elements.wrong.textContent = answered - correct;
      elements.remaining.textContent = quizConfig.questions.length - answered;
      elements.score.textContent = `${correct.toFixed(2)} /20`;
    }

    function moveNext() {
      if (!answers[currentQuestionIndex]) return;
      if (currentQuestionIndex === quizConfig.questions.length - 1) {
        finishQuiz();
        return;
      }
      currentQuestionIndex += 1;
      renderQuestion();
    }

    function movePrevious() {
      if (currentQuestionIndex === 0) return;
      currentQuestionIndex -= 1;
      renderQuestion();
    }

    function getRemark(score) {
      if (score <= 10.99) {
        return { title: "Keep Practising", description: "Review the main uses of modal verbs: ability, permission, possibility, advice, obligation, prohibition, necessity, and certainty." };
      }
      if (score <= 14.99) {
        return { title: "Good Progress", description: "You understand the basic functions, but you need more practice distinguishing similar meanings." };
      }
      if (score <= 17.99) {
        return { title: "Very Good", description: "You understand most modal verbs well. Review the questions you missed." };
      }
      return { title: "Excellent", description: "You have a very strong understanding of modal verbs and their functions." };
    }

    function getLevelScore(level) {
      return quizConfig.questions.reduce((total, question, index) => {
        return total + (question.level === level && answers[index] && answers[index].isCorrect ? 1 : 0);
      }, 0);
    }

    function animateRemark(finalRemark) {
      const remarkElement = document.getElementById("animated-remark");
      const labels = ["Keep Practising", "Good Progress", "Very Good", "Excellent"];
      const start = performance.now();
      const duration = 3000;

      function cycle(now) {
        const elapsed = now - start;
        const progress = Math.min(elapsed / duration, 1);
        const cycleIndex = Math.floor(elapsed / (90 + progress * 280)) % labels.length;
        remarkElement.textContent = labels[cycleIndex];
        if (progress < 1) {
          requestAnimationFrame(cycle);
        } else {
          remarkElement.textContent = finalRemark;
        }
      }
      requestAnimationFrame(cycle);
    }

    function finishQuiz() {
      finalTime = quizTimer.value();
      quizTimer.pause();
      const score = getScore();

      elements.quizScreen.style.display = "none";
      elements.reviewPage.classList.remove("visible");
      elements.resultPage.classList.add("visible");

      document.getElementById("final-score").textContent = `${score.toFixed(2)} /20`;
      const remark = getRemark(score);
      document.getElementById("remark-description").textContent = remark.description;
      animateRemark(remark.title);

      renderSummary(score);
      renderBreakdown();
      saveAttempt(score);

      if (score >= 18 && quizConfig.showConfetti) launchConfetti();
      playSound("complete");
    }

    function renderSummary(score) {
      const attempts = Number(localStorage.getItem("modalQuizAttempts") || 0);
      const bestScore = Number(localStorage.getItem("modalQuizBestScore") || 0);
      const wrong = quizConfig.questions.length - score;
      const accuracy = ((score / quizConfig.questions.length) * 100).toFixed(2);

      document.getElementById("summary-grid").innerHTML = [
        ["Final Score", `${score.toFixed(2)} /20`],
        ["Correct Answers", `${score}`],
        ["Wrong Answers", `${wrong}`],
        ["Accuracy Percentage", `${accuracy}%`],
        ["Time Taken", quizTimer.format(finalTime)],
        ["Number of Attempts", `${attempts}`],
        ["Best Score", `${bestScore.toFixed(2)} /20`]
      ].map(([label, value]) => `<div class="summary-item"><b>${value}</b><span>${label}</span></div>`).join("");
    }

    function renderBreakdown() {
      const output = [];
      for (let level = 1; level <= 8; level++) {
        const total = quizConfig.questions.filter(question => question.level === level).length;
        output.push(`<div class="breakdown-line"><span>Level ${level} — ${levelNames[level]}</span><b>${getLevelScore(level)}/${total}</b></div>`);
      }
      document.getElementById("breakdown-list").innerHTML = output.join("");
    }

    function saveAttempt(score) {
      if (resultRecorded) return;
      const attempts = Number(localStorage.getItem("modalQuizAttempts") || 0) + 1;
      const previousBest = Number(localStorage.getItem("modalQuizBestScore") || 0);
      localStorage.setItem("modalQuizAttempts", String(attempts));
      localStorage.setItem("modalQuizBestScore", String(Math.max(previousBest, score)));
      localStorage.setItem("modalQuizLastScore", String(score));
      localStorage.setItem("modalQuizTimeTaken", quizTimer.format(finalTime));
      resultRecorded = true;
    }

    function renderReview() {
      elements.resultPage.classList.remove("visible");
      elements.reviewPage.classList.add("visible");
      const content = document.getElementById("review-content");
      let markup = "";

      for (let level = 1; level <= 8; level++) {
        const levelQuestions = quizConfig.questions
          .map((question, index) => ({ question, index }))
          .filter(item => item.question.level === level);

        markup += `<section class="review-level"><h2>Level ${level} — ${levelNames[level]}</h2>`;
        levelQuestions.forEach(({ question, index }) => {
          const answer = answers[index];
          const stateClass = answer && answer.isCorrect ? "correct" : "wrong";
          markup += `
            <article class="review-question">
              <h3>${index + 1}. ${question.task}</h3>
              <div class="review-meta ${stateClass}"><strong>Student Answer:</strong> ${answer ? answer.selected : "No answer"}</div>
              <div class="review-meta correct"><strong>Correct Answer:</strong> ${question.correctAnswer}</div>
              <p class="review-explanation"><strong>Explanation:</strong> ${question.explanation}</p>
            </article>`;
        });
        markup += `</section>`;
      }
      content.innerHTML = markup;
    }

    function buildReport() {
      const score = getScore();
      const lines = [
        "ENGLISH2BAC QUIZZES",
        "Unit: 2",
        "MODAL VERBS",
        "GRAMMAR QUIZ 2",
        "",
        `Final Score: ${score.toFixed(2)} /20`,
        `Correct Answers: ${score}`,
        `Wrong Answers: ${20 - score}`,
        `Accuracy Percentage: ${((score / 20) * 100).toFixed(2)}%`,
        `Time Taken: ${quizTimer.format(finalTime)}`,
        "",
        "PER-LEVEL BREAKDOWN"
      ];
      for (let level = 1; level <= 8; level++) {
        const total = quizConfig.questions.filter(question => question.level === level).length;
        lines.push(`Level ${level} — ${levelNames[level]}: ${getLevelScore(level)}/${total}`);
      }
      return lines.join("\n");
    }

    function saveResults() {
      const blob = new Blob([buildReport()], { type: "text/plain" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "modal-verbs-grammar-quiz-2-results.txt";
      document.body.appendChild(link);
      link.click();
      URL.revokeObjectURL(link.href);
      link.remove();
    }

    function restartQuiz() {
      currentQuestionIndex = 0;
      answers = [];
      shuffledChoices = quizConfig.questions.map(question => quizConfig.randomizeChoices ? shuffle(question.choices) : [...question.choices]);
      finalTime = 0;
      resultRecorded = false;
      elements.resultPage.classList.remove("visible");
      elements.reviewPage.classList.remove("visible");
      elements.quizScreen.style.display = "block";
      quizTimer.reset();
      quizTimer.start();
      renderQuestion();
    }

    function launchConfetti() {
      const canvas = document.getElementById("confetti-canvas");
      const context = canvas.getContext("2d");
      const particles = Array.from({ length: 140 }, () => ({
        x: Math.random() * window.innerWidth,
        y: -20 - Math.random() * window.innerHeight,
        w: 5 + Math.random() * 7,
        h: 7 + Math.random() * 10,
        color: ["#2563eb", "#15803d", "#facc15", "#dc2626", "#7c3aed"][Math.floor(Math.random() * 5)],
        speed: 2 + Math.random() * 4,
        drift: -1.5 + Math.random() * 3,
        rotation: Math.random() * 360
      }));

      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      canvas.style.display = "block";
      const started = performance.now();

      function draw(now) {
        context.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(particle => {
          particle.y += particle.speed;
          particle.x += particle.drift;
          particle.rotation += 5;
          context.save();
          context.translate(particle.x, particle.y);
          context.rotate(particle.rotation * Math.PI / 180);
          context.fillStyle = particle.color;
          context.fillRect(-particle.w / 2, -particle.h / 2, particle.w, particle.h);
          context.restore();
        });
        if (now - started < 4200) {
          requestAnimationFrame(draw);
        } else {
          canvas.style.display = "none";
          context.clearRect(0, 0, canvas.width, canvas.height);
        }
      }
      requestAnimationFrame(draw);
    }

    elements.hintButton.addEventListener("click", () => elements.hintPanel.classList.add("visible"));
    elements.previous.addEventListener("click", movePrevious);
    elements.next.addEventListener("click", moveNext);
    document.getElementById("review-button").addEventListener("click", renderReview);
    document.getElementById("back-results-button").addEventListener("click", () => {
      elements.reviewPage.classList.remove("visible");
      elements.resultPage.classList.add("visible");
    });
    document.getElementById("restart-button").addEventListener("click", restartQuiz);
    document.getElementById("review-restart-button").addEventListener("click", restartQuiz);
    document.getElementById("print-button").addEventListener("click", () => window.print());
    document.getElementById("save-button").addEventListener("click", saveResults);

    document.addEventListener("keydown", event => {
      if (elements.quizScreen.style.display === "none") return;
      if (["1", "2", "3", "4"].includes(event.key) && !answers[currentQuestionIndex]) {
        const button = [...elements.choices.querySelectorAll(".choice-button")][Number(event.key) - 1];
        if (button) button.click();
      }
      if (event.key === "ArrowLeft") {
        event.preventDefault();
        movePrevious();
      }
      if (event.key === "ArrowRight") {
        event.preventDefault();
        moveNext();
      }
      if ((event.key === "Enter" || event.key === " ") && document.activeElement === elements.next) {
        event.preventDefault();
        moveNext();
      }
    });

    restartQuiz();
  </script>
