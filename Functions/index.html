  <script>
"use strict";
// Question content and scoring data are independent of editable presentation.
const quizConfig={unit:"2",title:"EXPRESSING LACK OF UNDERSTANDING & ASKING FOR CLARIFICATION",lesson:"FUNCTIONS - QUIZ 2",randomizeQuestions:false,randomizeChoices:true,timerEnabled:true,timerMode:"countup",showConfetti:true,enableSounds:true,questions:[
{type:"single-choice",category:"Mission 1 — Spot the Function",question:"WHAT FUNCTION DOES THE EXPRESSION SERVE?",task:"“I am not sure I got your point.”",choices:["A lack of understanding","Asking for clarification","Giving a clarification","Expressing your opinion"],correctAnswer:"A lack of understanding",explanation:"The speaker is admitting that they did not understand the point, so this expression shows a lack of understanding.",points:1},
{type:"single-choice",category:"Mission 1 — Spot the Function",question:"WHAT FUNCTION DOES THE EXPRESSION SERVE?",task:"“Can you explain more?”",choices:["A lack of understanding","Asking for clarification","Giving a clarification","Expressing your opinion"],correctAnswer:"Asking for clarification",explanation:"The speaker is asking someone to make the idea clearer, so this expression asks for clarification.",points:1},
{type:"matching",category:"Mission 2 — Match the Meaning",question:"MATCH EACH EXPRESSION WITH ITS MEANING.",pairs:[{id:"1",sentence:"“Sorry, I didn't quite hear what you said.”",correctFunction:"I need you to repeat it."},{id:"2",sentence:"“Could you clarify that more, please?”",correctFunction:"I would like more details."},{id:"3",sentence:"“It refers to …”",correctFunction:"I am explaining the word."}],functionOptions:["I need you to repeat it.","I would like more details.","I am explaining the word.","I want to change topics."],explanation:"'I want to change topics' is the distractor — none of the three expressions changes the subject. The first signals a hearing problem, the second asks for more detail, and the third gives an explanation.",points:3},
{type:"single-choice",category:"Mission 3 — Choose the Exact Expression",question:"WHAT SHOULD YOU ASK?",task:"Your teacher uses the word “humour.” You do not know what it means.",choices:["Could you repeat the word, please?","What do you mean by “humour”, please?","Could you speak more slowly, please?","Did you say “humour” or “human”, Sir?"],correctAnswer:"What do you mean by “humour”, please?",explanation:"You heard the word but do not know its meaning, so you should ask what it means; the other options deal with hearing, speed, or checking which word was said.",points:1},
{type:"single-choice",category:"Mission 3 — Choose the Exact Expression",question:"WHAT IS THE MOST USEFUL RESPONSE?",task:"Your teacher explains a task, but you cannot understand the instruction “compare your answers.”",choices:["Could you give us an example, please?","Could you repeat the date of the test?","Could you speak a little more slowly?","Could you say that a little louder, Sir?"],correctAnswer:"Could you give us an example, please?",explanation:"Asking for an example shows the teacher exactly what the instruction means; the other options deal with the test date, speed, or volume, not the instruction itself.",points:1},
{type:"single-choice",category:"Mission 3 — Choose the Exact Expression",question:"CHOOSE THE BEST REPLY.",task:"Your classmate says, “The presentation is postponed.” You understand the words but do not know what “postponed” means.",choices:["Sorry, I didn't quite hear what you said.","Could you say that a little louder, please?","What do you mean by “postponed”, exactly?","Did you say the presentation is tomorrow?"],correctAnswer:"What do you mean by “postponed”, exactly?",explanation:"You heard everything clearly, so the problem is the meaning of one word; asking 'What do you mean by …?' targets exactly that, while the other options deal with hearing.",points:1},
{type:"complete-exchange",category:"Mission 4 — Complete the Dialogue",question:"COMPLETE THE EXCHANGE APPROPRIATELY.",dialogue:[{speaker:"Teacher",text:"Please paraphrase the second paragraph."},{speaker:"Student",text:"..."}],missingSpeaker:"Student",choices:["Sorry, what do you mean by “paraphrase”?","It means saying it in your own words.","I totally agree with your suggestion.","Sorry, I forgot to bring my notebook."],correctAnswer:"Sorry, what do you mean by “paraphrase”?",function:"Asking for Clarification",explanation:"The student does not know the word 'paraphrase', so asking what it means is the appropriate response; the other options explain the word (the teacher's role), agree, or apologize.",points:1},
{type:"complete-exchange",category:"Mission 4 — Complete the Dialogue",question:"COMPLETE THE EXCHANGE APPROPRIATELY.",dialogue:[{speaker:"Student",text:"What does “deadline” mean, Sir?"},{speaker:"Teacher",text:"..."}],missingSpeaker:"Teacher",choices:["It refers to the final day to submit it.","Could you please clarify what you mean?","Sorry, I'm not sure I follow your point.","I think this exercise is much too easy."],correctAnswer:"It refers to the final day to submit it.",function:"Giving Clarification",explanation:"The student asked for the meaning of a word, so the teacher should give a clarification; the other options ask for clarification, admit confusion, or change the subject.",points:1},
{type:"complete-exchange",category:"Mission 4 — Complete the Dialogue",question:"COMPLETE THE EXCHANGE APPROPRIATELY.",dialogue:[{speaker:"Teacher",text:"Your project should be coherent and concise."},{speaker:"Student",text:"..."}],missingSpeaker:"Student",choices:["Excuse me, Sir, but I don't understand.","It means short and well organised, Sir.","Thank you, Sir, I enjoyed the lesson.","Yes, Sir, I will submit it tomorrow."],correctAnswer:"Excuse me, Sir, but I don't understand.",function:"Expressing Lack of Understanding",explanation:"The student did not understand the teacher's instruction, so the appropriate response is to say so politely; the other options give an explanation, thank the teacher, or promise to submit work as if the instruction were clear.",points:1},
{type:"single-choice",category:"Mission 5 — Fix the Misunderstanding",question:"WHAT SHOULD YOU SAY TO FIX THE MISUNDERSTANDING?",task:"Your friend says, “Let's meet at the library after the break.” You are not sure if she means the lunch break or the school holiday.",choices:["Did you mean the lunch break or holiday?","Could you repeat the time of the meeting?","Sorry, I didn't quite hear what you said.","I agree, the library is a quiet place."],correctAnswer:"Did you mean the lunch break or holiday?",explanation:"The problem is which 'break' she means, so checking with 'Did you mean …?' fixes it; the other options ask about something unrelated or deal with hearing.",points:1},
{type:"single-choice",category:"Mission 5 — Fix the Misunderstanding",question:"WHAT SHOULD YOU SAY TO FIX THE MISUNDERSTANDING?",task:"Your classmate explains the experiment: “The results demonstrate a strong correlation between the variables.” You cannot follow the explanation.",choices:["Could you say that in a different way?","Could you tell me the time of the lesson?","I'm really sorry I forgot my homework.","Could you lend me your blue pen, please?"],correctAnswer:"Could you say that in a different way?",explanation:"The wording is too complex, so asking your classmate to rephrase it addresses the problem; the other options are unrelated requests or apologies.",points:1},
{type:"single-choice",category:"Mission 5 — Fix the Misunderstanding",question:"WHAT DO YOU SAY TO CLEAR UP THE MISUNDERSTANDING?",task:"Your friend looks confused when you say, “I'm feeling under the weather.”",choices:["By that I mean that I feel a little sick.","What do you mean by “under the weather”?","Sorry, I didn't quite hear what you said.","Could you clarify that more for me, please?"],correctAnswer:"By that I mean that I feel a little sick.",explanation:"You are the speaker, so you should clarify your own expression; the other options are things the confused listener would say, not the speaker.",points:1},
{type:"single-choice",category:"Mission 6 — Expression Memory Challenge",question:"COMPLETE THE EXPRESSION FROM THE LESSON.",task:"“Sorry, I'm not sure I ______ you.”",choices:["follow","listen","pass","meet"],correctAnswer:"follow",explanation:"The lesson expression is 'Sorry, I'm not sure I follow you,' used to show a lack of understanding.",points:1},
{type:"single-choice",category:"Mission 6 — Expression Memory Challenge",question:"COMPLETE THE EXPRESSION FROM THE LESSON.",task:"“Did you ______ …?”",choices:["mean","means","meant","meaning"],correctAnswer:"mean",explanation:"After 'did' we use the base form of the verb, so the expression is 'Did you mean …?', used to ask for clarification.",points:1},
{type:"single-choice",category:"Mission 6 — Expression Memory Challenge",question:"WHICH EXPRESSION ASKS FOR CLARIFICATION?",task:"Choose the expression that asks the speaker to be clearer.",choices:["Could you be more explicit about that?","Sorry, I didn't quite hear what you said.","Excuse me, Sir, but I don't understand.","By that I mean the whole first chapter."],correctAnswer:"Could you be more explicit about that?",explanation:"'Could you be more explicit?' asks the speaker to make the idea clearer; the second signals a hearing problem, the third a lack of understanding, and the fourth gives a clarification.",points:1},
{type:"single-choice",category:"Mission 7 — Final Boss",question:"WHAT DOES THE STUDENT MEAN?",task:"Teacher: Photosynthesis is how plants make food.\nStudent: Sorry, I'm not sure I follow you.",choices:["I did not hear you clearly, Sir.","I do not understand the idea.","I would like a longer example.","I agree with what you said."],correctAnswer:"I do not understand the idea.",explanation:"'I'm not sure I follow you' shows a lack of understanding of the idea, not a hearing problem, a request for an example, or agreement.",points:1},
{type:"single-choice",category:"Mission 7 — Final Boss",question:"WHICH REPLY GIVES CLARIFICATION?",task:"Student: What does “erosion” mean?",choices:["It means the slow wearing away of soil.","Sorry, I didn't quite hear what you said.","Can you explain more about erosion, Sir?","Did you mean the wearing away of soil?"],correctAnswer:"It means the slow wearing away of soil.",explanation:"The student asked for a meaning, so the reply must explain it; the other options show a hearing problem, ask for more explanation, or ask a question back.",points:1},
{type:"single-choice",category:"Mission 7 — Final Boss",question:"WHAT IS THE BEST REPLY?",task:"A noisy truck passes while your teacher gives the homework. You catch only half of the sentence.",choices:["Sorry, I didn't quite hear what you said.","What do you mean by “homework”, please?","It refers to the exercise on page ten.","Did you mean the exercise on page ten?"],correctAnswer:"Sorry, I didn't quite hear what you said.",explanation:"The problem is hearing, not meaning, so you should say you did not hear; the other options ask about meaning, give an explanation, or guess what the teacher meant.",points:1}
]};
const $=id=>document.getElementById(id);
const questions=quizConfig.questions;
const totalPoints=questions.reduce((sum,q)=>sum+q.points,0);
let index=0,answers=questions.map(()=>({locked:false,matches:{},selected:null,earned:0}));
let audioContext=null,remarkTimer=null;

// Timer is independent of question rendering; wall-clock deltas keep it accurate across navigation.
const timer=(()=>{let elapsed=0,startedAt=0,interval=null;function seconds(){return elapsed+(interval?Math.floor((Date.now()-startedAt)/1000):0)}function format(value=seconds()){return `${String(Math.floor(value/60)).padStart(2,"0")}:${String(value%60).padStart(2,"0")}`}function paint(){$("timer-stat").textContent=`Timer ${format()}`}return{start(){if(interval)return;startedAt=Date.now();interval=setInterval(paint,1000);paint()},pause(){if(interval){elapsed=seconds();clearInterval(interval);interval=null}paint()},reset(){if(interval)clearInterval(interval);interval=null;elapsed=0;startedAt=0;paint()},seconds,format}})();

function sound(kind){if(!quizConfig.enableSounds)return;try{audioContext ||= new (window.AudioContext||window.webkitAudioContext)();if(audioContext.state==="suspended")audioContext.resume();const notes=kind==="complete"?[523,659,784]:kind==="correct"?[523,659]:kind==="wrong"?[330,277]:[440];notes.forEach((note,i)=>{const oscillator=audioContext.createOscillator(),gain=audioContext.createGain(),time=audioContext.currentTime+i*.11;oscillator.type="sine";oscillator.frequency.value=note;gain.gain.setValueAtTime(.0001,time);gain.gain.exponentialRampToValueAtTime(.055,time+.015);gain.gain.exponentialRampToValueAtTime(.0001,time+.17);oscillator.connect(gain).connect(audioContext.destination);oscillator.start(time);oscillator.stop(time+.18)})}catch(error){}}
function shuffle(list){const copy=[...list];for(let i=copy.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[copy[i],copy[j]]=[copy[j],copy[i]]}return copy}
// Shuffle once on first render and keep the cached display order through graded redraws.
function displayOrder(q){return q._displayOrder ||= shuffle(q.type==="matching"?q.functionOptions:q.choices)}
function text(tag,content,className=""){const node=document.createElement(tag);node.textContent=content;if(className)node.className=className;return node}
function updateStats(){const completed=answers.filter(a=>a.locked);$("correct-stat").textContent=`✅ Correct: ${completed.filter((a,i)=>a.earned===questions[answers.indexOf(a)].points).length}`;$("wrong-stat").textContent=`❌ Wrong: ${completed.filter(a=>a.earned<questions[answers.indexOf(a)].points).length}`;$("remaining-stat").textContent=`Remaining: ${questions.length-completed.length}`;$("score-stat").textContent=`Score: ${answers.reduce((sum,a)=>sum+a.earned,0).toFixed(2)} /20`;timer.start()}
function feedback(q,a){const box=text("div","", "feedback");const successful=a.earned===q.points;box.append(text("strong",successful?"Great Job!":"Keep learning!"),text("span",q.explanation));return box}
function evaluate(earned){const a=answers[index];a.earned=earned;a.locked=true;sound(earned===questions[index].points?"correct":"wrong");render()}
function choiceButton(choice,position,selected,locked,correctAnswer,onClick){const button=text("button",`${position+1}. ${choice}`,"choice");button.type="button";if(locked){button.disabled=true;if(choice===correctAnswer)button.classList.add("correct");else if(choice===selected)button.classList.add("wrong")}else if(choice===selected)button.classList.add("selected");button.addEventListener("click",onClick);return button}
function renderSingle(q,a,area){area.append(text("p",q.task,"task"));const choices=text("div","","choices");displayOrder(q).forEach((choice,position)=>choices.append(choiceButton(choice,position,a.selected,a.locked,q.correctAnswer,()=>{if(a.locked)return;a.selected=choice;evaluate(choice===q.correctAnswer?q.points:0)})));area.append(choices);if(a.locked)area.append(feedback(q,a))}

// Each independent selection is held by pair ID. Per-pair value is derived from q.points.
function renderMatching(q,a,area){const rows=text("div","","matching");const selects=[];const check=text("button","Check Matches","action");check.type="button";function checkAllSelected(){check.disabled=a.locked||!q.pairs.every(pair=>Boolean(a.matches[pair.id]))}q.pairs.forEach((pair,number)=>{const row=text("div","","match-row");if(a.locked)row.classList.add(a.matches[pair.id]===pair.correctFunction?"correct":"wrong");row.append(text("span",`${number+1}. ${pair.sentence}`));const select=document.createElement("select");select.setAttribute("aria-label",`Meaning for expression ${number+1}`);const placeholder=new Option("Select the meaning…","",false,false);placeholder.disabled=true;select.add(placeholder);displayOrder(q).forEach(option=>select.add(new Option(option,option)));select.value=a.matches[pair.id]||"";select.disabled=a.locked;const update=()=>{a.matches[pair.id]=select.value;checkAllSelected()};select.addEventListener("change",update);select.addEventListener("input",update);selects.push(select);row.append(select);if(a.locked&&a.matches[pair.id]!==pair.correctFunction)row.append(text("span",`Correct meaning: ${pair.correctFunction}`,"match-result"));rows.append(row)});area.append(rows);if(!a.locked){check.addEventListener("click",()=>{if(!q.pairs.every(pair=>a.matches[pair.id]))return;const earned=q.pairs.reduce((sum,pair)=>sum+(a.matches[pair.id]===pair.correctFunction?q.points/q.pairs.length:0),0);evaluate(earned)});area.append(check);checkAllSelected()}else area.append(feedback(q,a))}

// Conversation cards select first, then check; only grading animates the answer into the bubble.
function renderExchange(q,a,area){const dialogue=text("div","","dialogue");q.dialogue.forEach((turn,number)=>{const bubble=text("div","",`bubble ${number?"reply":""}`);bubble.append(text("strong",turn.speaker),text("span",number&&a.locked?q.correctAnswer:turn.text));if(number&&a.locked)bubble.classList.add("completed");dialogue.append(bubble)});area.append(dialogue);const choices=text("div","","choices");const check=text("button","Check Answer","action");check.type="button";check.disabled=!a.selected||a.locked;displayOrder(q).forEach((choice,position)=>choices.append(choiceButton(choice,position,a.selected,a.locked,q.correctAnswer,()=>{if(a.locked)return;a.selected=choice;sound("select");choices.querySelectorAll(".choice").forEach(button=>button.classList.remove("selected"));choices.children[position].classList.add("selected");check.disabled=false})));area.append(choices);if(!a.locked){check.addEventListener("click",()=>{if(a.selected)evaluate(a.selected===q.correctAnswer?q.points:0)});area.append(check)}else{area.append(text("div",`Function: ${q.function}`,"tag"));area.append(feedback(q,a))}}
function render(){const q=questions[index],a=answers[index],area=$("question-area");$("instruction").textContent=q.question;area.replaceChildren();if(q.type==="matching")renderMatching(q,a,area);else if(q.type==="complete-exchange")renderExchange(q,a,area);else renderSingle(q,a,area);$("counter").textContent=`${index+1} / ${questions.length}`;$("previous").disabled=index===0;$("next").disabled=!a.locked;$("next").textContent=index===questions.length-1?"See Results ▶":"Next ▶";updateStats()}
function storedNumber(key){try{return Number(localStorage.getItem(key))||0}catch(error){return 0}}
function store(key,value){try{localStorage.setItem(key,String(value))}catch(error){}}
function remarkFor(score){return score<10?"Fail":score<12?"Pass":score<14?"Fairly Good":score<16?"Good":score<18?"Very Good":"Excellent!"}
function missionData(){const missions=new Map();questions.forEach((q,i)=>{if(!missions.has(q.category))missions.set(q.category,{earned:0,total:0});const value=missions.get(q.category);value.earned+=answers[i].earned;value.total+=q.points});return missions}
function confetti(){const layer=$("confetti");layer.replaceChildren();for(let i=0;i<85;i++){const piece=text("span","","piece");piece.style.left=`${Math.random()*100}%`;piece.style.background=["#2563eb","#16a34a","#ffd34f","#e95a66"][i%4];piece.style.animationDelay=`${Math.random()*1.5}s`;layer.append(piece)}setTimeout(()=>layer.replaceChildren(),5000)}
function result(){timer.pause();$("quiz-view").hidden=true;$("result-view").hidden=false;const score=answers.reduce((sum,a)=>sum+a.earned,0),attempts=storedNumber("english2bac_attempts")+1,best=Math.max(score,storedNumber("english2bac_best"));store("english2bac_attempts",attempts);store("english2bac_best",best);store("english2bac_last",score);store("english2bac_time",timer.format());$("final-score").textContent=`${score.toFixed(2)} /20`;const full=answers.filter((a,i)=>a.earned===questions[i].points).length,wrong=questions.length-full;const values=[["Final Score",`${score.toFixed(2)} /20`],["Correct Answers",full],["Wrong Answers",wrong],["Accuracy Percentage",`${(100*score/totalPoints).toFixed(2)}%`],["Time Taken",timer.format()],["Number of Attempts",attempts],["Best Score",`${best.toFixed(2)} /20`]];$("summary").replaceChildren(...values.map(([label,value])=>text("div",`${label}: ${value}`)));$("mission-breakdown").replaceChildren(...[...missionData()].map(([name,value])=>text("div",`${name}: ${value.earned.toFixed(2)}/${value.total}`,"mission-line")));$("review").hidden=true;$("review").replaceChildren();$("remark").textContent="Fail";clearTimeout(remarkTimer);const cycle=["Fail","Pass","Fairly Good","Good","Very Good","Excellent!"];let step=0;function spin(){if(step>=18){$("remark").textContent=remarkFor(score);return}$("remark").textContent=cycle[step%cycle.length];const delay=75+step*10;step++;remarkTimer=setTimeout(spin,delay)}spin();sound("complete");if(score>=16&&quizConfig.showConfetti)confetti()}
function review(){const panel=$("review");if(!panel.hidden){panel.hidden=true;return}panel.replaceChildren();let category="";questions.forEach((q,i)=>{const a=answers[i];if(q.category!==category){category=q.category;panel.append(text("h2",category))}const card=document.createElement("article");card.append(text("strong",`Question ${i+1}: ${q.question}`));if(q.type==="matching"){q.pairs.forEach(pair=>{const right=a.matches[pair.id]===pair.correctFunction;card.append(text("p",`${pair.sentence} — Student's Match: ${a.matches[pair.id]} | Correct Meaning: ${pair.correctFunction}`,right?"good":"bad"))})}else{if(q.type==="complete-exchange"){q.dialogue.forEach(turn=>{if(turn.text!=="...")card.append(text("p",`${turn.speaker}: ${turn.text}`))});card.append(text("p",`Function: ${q.function}`))}else card.append(text("p",q.task));card.append(text("p",`Student Answer: ${a.selected}`,a.selected===q.correctAnswer?"good":"bad"));card.append(text("p",`Correct Answer: ${q.correctAnswer}`,"good"))}card.append(text("p",`Explanation: ${q.explanation}`));panel.append(card)});panel.hidden=false;panel.scrollIntoView({behavior:"smooth",block:"start"})}
function restart(){clearTimeout(remarkTimer);questions.forEach(q=>delete q._displayOrder);answers=questions.map(()=>({locked:false,matches:{},selected:null,earned:0}));index=0;timer.reset();$("confetti").replaceChildren();$("result-view").hidden=true;$("quiz-view").hidden=false;render();window.scrollTo({top:0,behavior:"smooth"})}
function saveResults(){const score=answers.reduce((sum,a)=>sum+a.earned,0);const lines=["English2BAC Quizzes","UNIT: 2",quizConfig.title,quizConfig.lesson,`Final Score: ${score.toFixed(2)} /20`,`Remark: ${remarkFor(score)}`,`Correct Answers: ${answers.filter((a,i)=>a.earned===questions[i].points).length}`,`Wrong Answers: ${answers.filter((a,i)=>a.earned<questions[i].points).length}`,`Accuracy Percentage: ${(100*score/totalPoints).toFixed(2)}%`,`Time Taken: ${timer.format()}`,`Number of Attempts: ${storedNumber("english2bac_attempts")}`,`Best Score: ${storedNumber("english2bac_best").toFixed(2)} /20`,"",...([...missionData()].map(([name,value])=>`${name}: ${value.earned.toFixed(2)}/${value.total}`))];const url=URL.createObjectURL(new Blob([lines.join("\n")],{type:"text/plain;charset=utf-8"}));const link=document.createElement("a");link.href=url;link.download="English2BAC-Unit-2-results.txt";document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
$("previous").addEventListener("click",()=>{if(index>0){index--;render()}});
$("next").addEventListener("click",()=>{if(!answers[index].locked)return;if(index===questions.length-1)result();else{index++;render()}});
$("review-button").addEventListener("click",review);$("restart-button").addEventListener("click",restart);$("print-button").addEventListener("click",()=>window.print());$("save-button").addEventListener("click",saveResults);
document.addEventListener("keydown",event=>{if($("quiz-view").hidden||event.altKey||event.ctrlKey||event.metaKey||["SELECT","INPUT","TEXTAREA"].includes(document.activeElement.tagName))return;const q=questions[index],a=answers[index];if(q.type==="matching")return;if(/^[1-4]$/.test(event.key)&&!a.locked){const button=$("question-area").querySelectorAll(".choice")[Number(event.key)-1];if(button){event.preventDefault();button.click()}}else if(event.key==="Enter"&&q.type==="complete-exchange"&&a.selected&&!a.locked){event.preventDefault();$("question-area").querySelector(".action").click()}else if((event.key==="Enter"||event.key===" ")&&q.type==="single-choice"&&!a.locked&&document.activeElement.classList.contains("choice")){event.preventDefault();document.activeElement.click()}});
render();
</script>
 
</body></html>
